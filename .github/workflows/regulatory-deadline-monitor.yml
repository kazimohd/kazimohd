name: Regulatory deadline monitor

on:
  schedule:
    # 13:30 UTC = 7:00 PM Asia/Kolkata. A date gate below limits this to every two days.
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: regulatory-deadline-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply every-two-days cadence
        id: cadence
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          start = date(2026, 8, 29)
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          print(f"run={'true' if (today-start).days >= 0 and (today-start).days % 2 == 0 else 'false'}")
          PY

      - name: Set up Python
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: regulatory_monitor/requirements.txt

      - name: Install dependencies
        if: steps.cadence.outputs.run == 'true'
        run: pip install -r regulatory_monitor/requirements.txt

      - name: Check primary official sources
        if: steps.cadence.outputs.run == 'true'
        id: monitor
        run: python regulatory_monitor/monitor.py

      - name: Check blocked-source official fallbacks
        if: steps.cadence.outputs.run == 'true'
        id: fallback
        run: python regulatory_monitor/fallback_monitor.py

      - name: Save checked-notice baselines
        if: steps.cadence.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regulatory_monitor/state.json regulatory_monitor/fallback_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update regulatory notice monitor state"
            git push
          fi

      - name: Notify only when a new matching notice is found
        if: steps.cadence.outputs.run == 'true' && (steps.monitor.outputs.has_alert == 'true' || steps.fallback.outputs.fallback_has_alert == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > regulatory_monitor/combined_alert.md
          if [[ -f regulatory_monitor/alert.md ]]; then
            cat regulatory_monitor/alert.md >> regulatory_monitor/combined_alert.md
          fi
          if [[ -f regulatory_monitor/fallback_alert.md ]]; then
            printf '\n' >> regulatory_monitor/combined_alert.md
            cat regulatory_monitor/fallback_alert.md >> regulatory_monitor/combined_alert.md
          fi

          stamp="$(TZ=Asia/Kolkata date '+%Y%m%d-%H%M%S')"
          branch="regulatory-alert-$stamp"
          alert_file="regulatory_monitor/alerts/$stamp.md"
          mkdir -p regulatory_monitor/alerts
          cp regulatory_monitor/combined_alert.md "$alert_file"

          git checkout -b "$branch"
          git add "$alert_file"
          git commit -m "alert: new regulatory application notice"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Regulatory application/deadline alert - $(TZ=Asia/Kolkata date '+%d %b %Y')" \
            --body-file regulatory_monitor/combined_alert.md)
          gh pr edit "$pr_url" --add-reviewer kazimohd || true
          echo "Alert pull request: $pr_url"
