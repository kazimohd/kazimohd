name: Temporary NCISM source-format check

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/debug-ncism-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect alternate official NCISM pages
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          urls=(
            'https://ncismindia.org/index.php'
            'https://ncismindia.org/archives.php'
            'https://ncismindia.org/index.php/latestupdate/'
            'https://ncismindia.org/index.php/electives.php'
            'https://ncismindia.org/index.php/lib/tenders.php'
            'https://ncismindia.org/index.php/latestupdate/Siddha%20college/Sowa%20Rigpa%20college/assets/pdf/List%20of%20Permitted%20Ayurveda%20Colleges%20for%20the%20Academic%20Year%202025-26%20as%20on%2025.06.2025.pdf'
            'http://ncismindia.org/index.php'
            'http://ncismindia.org/archives.php'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            file="/tmp/ncism-$i.html"
            echo "=== $url ==="
            code=$(curl -L --connect-timeout 8 --max-time 25 -A "$UA" -sS -w '%{http_code}' "$url" -o "$file")
            echo "http=$code bytes=$(wc -c < "$file" 2>/dev/null) final=$(curl -L --connect-timeout 5 --max-time 8 -A "$UA" -sS -o /dev/null -w '%{url_effective}' "$url")"
            grep -inE 'new PG|PG course|post.?graduate|2026-27|2027-28|increase.*PG|Submission of application' "$file" | head -30
            sed -n '1,5p' "$file"
          done
