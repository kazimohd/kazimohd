name: Temporary NCISM source-format check

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/debug-ncism-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect search-index fallbacks
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'

          echo '=== BING RSS SIMPLE ==='
          curl -L --max-time 45 -A "$UA" 'https://www.bing.com/search?format=rss&q=site%3Ancismindia.org+%22new+PG+courses%22+Ayurveda' -o /tmp/bing-simple.xml
          echo "bytes=$(wc -c < /tmp/bing-simple.xml 2>/dev/null)"
          grep -oE '<item>.*?</item>' /tmp/bing-simple.xml | head -20
          grep -inE 'ncism|PG course|2026-27|2027-28' /tmp/bing-simple.xml | head -50

          echo '=== BING HTML SIMPLE ==='
          curl -L --max-time 45 -A "$UA" 'https://www.bing.com/search?q=site%3Ancismindia.org+%22new+PG+courses%22+Ayurveda&count=20' -o /tmp/bing.html
          echo "bytes=$(wc -c < /tmp/bing.html 2>/dev/null)"
          grep -ioE 'https?://[^" <]*ncismindia\.org[^" <]*' /tmp/bing.html | head -30
          grep -inE 'new PG|PG course|2026-27|2027-28|ncismindia' /tmp/bing.html | head -30

          echo '=== DUCKDUCKGO HTML ==='
          curl -L --max-time 45 -A "$UA" -d 'q=site%3Ancismindia.org+%22new+PG+courses%22+Ayurveda' 'https://html.duckduckgo.com/html/' -o /tmp/ddg.html
          echo "bytes=$(wc -c < /tmp/ddg.html 2>/dev/null)"
          grep -ioE 'https?://[^" <]*ncismindia\.org[^" <]*' /tmp/ddg.html | head -30
          grep -inE 'new PG|PG course|2026-27|2027-28|ncismindia' /tmp/ddg.html | head -30

          echo '=== GOOGLE HTML ==='
          curl -L --max-time 45 -A "$UA" 'https://www.google.com/search?q=site%3Ancismindia.org+%22new+PG+courses%22+Ayurveda&num=20' -o /tmp/google.html
          echo "bytes=$(wc -c < /tmp/google.html 2>/dev/null)"
          grep -ioE 'https?://[^" <]*ncismindia\.org[^" <]*' /tmp/google.html | head -30
          grep -inE 'new PG|PG course|2026-27|2027-28|ncismindia' /tmp/google.html | head -30

          echo '=== SEARCH-INDEX PAGE SNAPSHOT VIA JINA ==='
          curl -L --max-time 45 -A "$UA" 'https://r.jina.ai/https://www.google.com/search?q=site%3Ancismindia.org+%22new+PG+courses%22+Ayurveda' -o /tmp/jina-google.txt
          echo "bytes=$(wc -c < /tmp/jina-google.txt 2>/dev/null)"
          grep -inE 'new PG|PG course|2026-27|2027-28|ncismindia' /tmp/jina-google.txt | head -60
